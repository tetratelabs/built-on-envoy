# Sub-agents: the main agent gets the capable model, and the work it delegates to sub-agents gets
# the efficient one. Sub-agent requests carry x-switchyard-is-subagent: true and their agent ID in
# x-switchyard-agent-id. Any algorithm can be used for either.
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        virtual_models:
          - name: coding-auto
            targets:
              efficient: gpt-4.1-mini
              capable: gpt-5
            algorithm:
              type: passthrough
              target: capable
              subagents:
                type: passthrough
                target: efficient
