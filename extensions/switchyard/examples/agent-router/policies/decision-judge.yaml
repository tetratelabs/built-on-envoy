# llm_classifier with a decision judge: a System One endpoint, such as TypeSafe's Jev API, answers
# whether the capable model has an advantage on the task. Decision calls go directly to the decision
# API (see loopback.yaml), as Agent Router does not route decision APIs. Add its credentials with
# decision_calls.headers. The fake decision API answers that tasks that contain "[hard]" need the
# capable model.
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        virtual_models:
          - name: coding-auto
            targets:
              efficient: gpt-4.1-mini
              capable: gpt-5
              judge: jev
            algorithm:
              type: llm_classifier
              classifier_target: judge
              strong_target: capable
              weak_target: efficient
              fail_open: false
              decision:
                cutoff: 0.5
                candidates:
                  capable_first: capable
                  efficient_first: efficient
                evidence:
                  description: Whether the capable model is needed to solve the task.
            default_model: gpt-5
        decision_calls:
          cluster: switchyard-decisions
          path: /v1/systemone
          format: system_one
          forward_headers: [x-tenant-id, agent-session-id]
        routing_headers: true
