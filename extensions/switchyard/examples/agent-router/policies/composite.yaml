# composite: a judge picks the tier at each user turn, and a stage router runs the agent steps
# within it, escalating on tool failures. The fake judge rates tasks that contain "[hard]" as
# beyond the efficient model.
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        virtual_models:
          - name: coding-auto
            targets:
              efficient: gpt-4.1-mini
              capable: gpt-5
              judge: judge-model
            algorithm:
              type: composite
              classifier:
                target: judge
                base_threshold: 0.5
                classify_trigger: user_turn
              stage:
                capable_target: capable
                efficient_target: efficient
        # Judges that name a target, and the verifier and executor calls, loop back through the
        # Gateway (see loopback.yaml) with the client's credentials, tenant and session, so Agent
        # Router routes, charges and records them like any other request.
        model_calls:
          cluster: gateway_loopback
          forward_headers: [authorization, x-tenant-id, agent-session-id]
        # Adds the calls and tokens spent on routing to the response headers.
        routing_headers: true
