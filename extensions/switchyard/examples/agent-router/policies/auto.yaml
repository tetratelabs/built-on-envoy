# auto: Switchyard's recommended preset. Agent steps that only read go to the efficient model, and
# critical tool errors escalate to the capable model. Free-tier tenants always get the efficient
# model, and sessions of different tenants never share routing state.
#
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        virtual_models:
          # Free-tier tenants always get the efficient model.
          - name: coding-auto
            match_headers:
              - name: x-tier
                value: free
            targets:
              efficient: gpt-4.1-mini
            algorithm:
              type: passthrough
              target: efficient
          # Everyone else gets the tier Switchyard picks for each agent step.
          - name: coding-auto
            targets:
              efficient: gpt-4.1-mini
              capable: gpt-5
            algorithm:
              type: auto
              capable_target: capable
              efficient_target: efficient
            default_model: gpt-4.1-mini
        session:
          # Sessions of different tenants never share routing state.
          scope_headers:
            - x-tenant-id
