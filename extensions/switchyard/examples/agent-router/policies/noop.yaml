# noop: answers "OK" without calling any model. Useful to smoke test the gateway and the clients.
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        virtual_models:
          - name: coding-auto
            targets:
              any: gpt-4.1-mini
            algorithm:
              type: noop
