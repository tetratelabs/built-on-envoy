# advisor: the executor model answers every turn, and an advisor model reviews the turns that end
# the task before the client sees them. An approved answer is sent to the client by the filter; a
# rejected one is redone by the executor with the advisor's feedback. Each session gets one review
# by default (max_reviews).
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        virtual_models:
          - name: coding-auto
            targets:
              executor: gpt-4.1-mini
              advisor: judge-model
            algorithm:
              type: advisor
              executor_target: executor
              advisor_target: advisor
        # Judge, verifier and executor calls loop back through the Gateway (see loopback.yaml), with
        # the client's credentials, tenant and session, so Agent Router routes, charges and records
        # them like any other request.
        model_calls:
          cluster: switchyard-loopback
          forward_headers: [authorization, x-tenant-id, agent-session-id]
        # Adds the calls and tokens spent on routing to the response headers.
        routing_headers: true
