# passthrough: every coding-auto request goes to the capable model.
#
#   curl ... -d '{"model": "coding-auto", ...}'   # served by gpt-5
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        virtual_models:
          - name: coding-auto
            targets:
              capable: gpt-5
            algorithm:
              type: passthrough
              target: capable
