# Eligible models: the models a request may be routed to are limited per request, for example to
# the models of the tenant's plan. The algorithm only sees the eligible targets.
#
# The x-switchyard-eligible-models header must be set by a trusted filter that runs before this one,
# such as an ext_authz service, which must also remove the header when clients send it. For this
# example, the client sets it.
# All the policies in this directory are named "switchyard", so applying one replaces the other.
# The policy must target the whole Gateway: Envoy picks the filters for a request from the first
# route it matches, before the model is known, and for Agent Router that is usually the catch-all
# "route-not-found" rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: switchyard
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: switchyard
  dynamicModule:
    - name: switchyard
      filterName: switchyard
      config:
        eligible_models_header: x-switchyard-eligible-models
        virtual_models:
          - name: coding-auto
            targets:
              efficient: gpt-4.1-mini
              capable: gpt-5
            algorithm:
              type: random
              targets: [efficient, capable]
