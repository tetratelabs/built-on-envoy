# Agent Router routes for the target models and the judge. Nothing here is specific to Switchyard:
# the filter rewrites the model in the request body, and Agent Router routes the request as if the
# client had asked for that model. The judge, verifier and advisor calls of the algorithms loop
# back through the Gateway, and are routed the same way.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: switchyard
  namespace: default
spec:
  parentRefs:
    - name: switchyard
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4.1-mini
      backendRefs:
        - name: efficient
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-5
      backendRefs:
        - name: capable
    # The model the algorithms call to judge, verify or review. Never a routing target.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: judge-model
      backendRefs:
        - name: judge
    # Optional. Lists the virtual model in /v1/models, and serves requests the filter leaves
    # unchanged, for example when routing fails and the failure mode is passthrough.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: coding-auto
      backendRefs:
        - name: efficient
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: efficient
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: efficient
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: capable
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: capable
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: judge
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: judge
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: efficient
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: efficient.default.svc.cluster.local
        port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: capable
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: capable.default.svc.cluster.local
        port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: judge
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: judge.default.svc.cluster.local
        port: 80
