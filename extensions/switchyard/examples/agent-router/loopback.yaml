# Envoy clusters for the calls the Switchyard algorithms make, referenced by the model_calls and
# decision_calls blocks of the policies.
#
#   - switchyard-loopback: the Gateway's own listener. Judge, verifier and advisor calls go back
#     through the Gateway, so Agent Router applies its credentials, translation, rate limits, costs
#     and telemetry to them, as to any other request.
#   - switchyard-decisions: the decision API, called directly. Agent Router does not route
#     decision APIs, such as System One.
#
# EnvoyPatchPolicy must be enabled in Envoy Gateway (config.envoyGateway.extensionApis.
# enableEnvoyPatchPolicy), as Agent Router's Envoy Gateway values do.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: switchyard-clusters
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: switchyard
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: switchyard-loopback
      operation:
        op: add
        path: ""
        value:
          name: switchyard-loopback
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: switchyard-loopback
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        # Envoy Gateway listens on the Gateway's port plus 10000 for ports below 1024.
                        socket_address: {address: 127.0.0.1, port_value: 10080}
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: switchyard-decisions
      operation:
        op: add
        path: ""
        value:
          name: switchyard-decisions
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: switchyard-decisions
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: judge.default.svc.cluster.local, port_value: 80}
