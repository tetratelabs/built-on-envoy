examples:
  - title: Delay all success responses and introduce a 1% failure rate that returns quickly
    description: |
      Wrap a fast, successful mock service to simulate production latency and an approximately 1% failure rate.
      Capture one 200 response and one injected 503 response by retrying until each status occurs.
      Show the original HTTP exchange, including the fault headers and response body.
      This demonstrates both response cases without measuring the failure rate.
    config:
      endpoints:
        - match:
            prefix: /
          responses:
            - status: 200
              resolution: 1000
              distribution:
                p0.0: 30ms
                p100.0: 500ms
            - status: 503
              resolution: 10
              distribution:
                p0.0: 3ms
                p100.0: 5ms
    commands:
      - comment: Capture a successful upstream response with the sampled latency.
        argv:
          - curl
          - --disable
          - --silent
          - --show-error
          - --verbose
          - --user-agent
          - boe-example
          - --max-time
          - "10"
          - "${PROXY_URL}/status/200"
        retry:
          httpStatus: 200
          maxAttempts: 1000
      - comment: Capture a sampled failure replacing the successful upstream response.
        argv:
          - curl
          - --disable
          - --silent
          - --show-error
          - --verbose
          - --user-agent
          - boe-example
          - --max-time
          - "10"
          - "${PROXY_URL}/status/200"
        retry:
          httpStatus: 503
          maxAttempts: 1000
    volatileHeaders:
      - x-envoy-upstream-service-time
      - x-fault-injected-delay
      - x-fault-actual-upstream
      - x-fault-added-delay
    code: |
      ```sh
      # Terminal 1
      boe run --extension dynamic-fault-injection --envoy-version 1.38.0 --config '
        {
          "endpoints": [
            {
              "match": {
                "prefix": "/"
              },
              "responses": [
                {
                  "distribution": {
                    "p0.0": "30ms",
                    "p100.0": "500ms"
                  },
                  "resolution": 1000,
                  "status": 200
                },
                {
                  "distribution": {
                    "p0.0": "3ms",
                    "p100.0": "5ms"
                  },
                  "resolution": 10,
                  "status": 503
                }
              ]
            }
          ]
        }'
      ```

      ```sh
      # Terminal 2 (after Envoy is ready)
      # Capture a successful upstream response with the sampled latency.
      # Repeat until HTTP 200, up to 1000 attempts.
      curl --disable --silent --show-error --verbose --user-agent boe-example \
        --max-time 10 http://localhost:10000/status/200
      ```

