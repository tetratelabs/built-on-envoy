longDescription: |
  # Envoy Latency and Fault Distribution Simulation

  An Envoy [dynamic module](https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/advanced/dynamic_modules) **upstream HTTP filter** written in Go that injects latency and fault responses based on configurable percentile distributions.

  This is similar to Envoy's built-in [fault injection filter](https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/fault_filter.html) but adds support for **percentile-based latency distributions** with **per-status-code weighting** — allowing you to simulate realistic endpoint behavior including error rates, latency profiles, and load-dependent degradation.

  **Key differentiator**:
  By operating as an **upstream filter on the cluster**, this module measures the actual upstream response time and only injects the *remaining* delay needed to reach the target distribution value.
  If the upstream is already slower than the target, no additional delay is added.

  ## Features

  - **Percentile-based latency injection**: Configure latency distributions using flexible percentile notation (`p0.0`, `p50.0`, `p99.9`, `p100.0`)
  - **Per-status-code distributions**: Define different latency profiles for different HTTP status codes (e.g., 200s are fast, 503s are slow)
  - **Resolution-based weighting**: Use `resolution` as both the sampling accuracy and the relative weight for status code selection
  - **Load-based behavior**: Configure different response profiles based on current RPS with smooth grey-zone transitions
  - **Grey zone penalties**: Model degradation with spike detection, penalty multipliers, and recovery rates
  - **Route matching**: Apply different fault configurations via prefix/exact path matching and header matching
  - **First-match routing**: Endpoints are evaluated in order; first match wins
  - **Upstream-aware timing**: Measures actual upstream latency and only adds the remaining delay to reach the target — avoids over-delaying when the upstream is naturally slow

  ## Comparison with Envoy's Built-in Fault Filter

  | Feature | Built-in Fault Filter | This Module |
  |---------|----------------------|-------------|
  | Fixed delay | ✅ | ✅ (flat distribution) |
  | Percentile distributions | ❌ | ✅ |
  | Per-status-code distributions | ❌ | ✅ |
  | Load-based degradation | ❌ | ✅ |
  | HTTP abort | ✅ | ✅ |
  | gRPC abort | ✅ | (planned) |
  | Header-controlled faults | ✅ | ❌ (route-based instead) |
  | Response rate limiting | ✅ | ❌ |
  | Per-route configuration | Via per-route config | Built-in route matching |
  | Runtime configuration | ✅ | ❌ |
  | Exact distribution over N requests | ❌ | ✅ (stateful distribution) |

  ## Configuration
  Please find an overview of the possible fields below, followed by an actual example of how to configure the filter as a per cluster http filter.

  ### Configuration Fields

  Filter-level configuration retains `endpoints[]` for launchers that cannot express Envoy route
  configuration. When this filter is configured through Envoy's `typed_per_filter_config`, the
  per-route value must use the direct behavior shape: `responses` or `load_based` at the top level.
  `endpoints[]` is rejected by the per-route configuration constructor because route matching is
  performed by Envoy.

  > [!NOTE]
  > Per-route configuration is not currently accessible through the `boe` CLI. It requires direct
  > control of the Envoy bootstrap configuration to add `typed_per_filter_config` to a route.

  If the upstream returns a status code that has no configured behavior for the selected endpoint
  or per-route configuration, the filter passes that response through without injecting latency and
  still sets fault metadata headers: `x-fault-injected-delay: 0s`, `x-fault-added-delay: 0s`,
  `x-fault-status: <upstream status>`, and `x-fault-actual-upstream: <measured duration>`.

  | Field | Description |
  |-------|-------------|
  | `endpoints` | Array of endpoint configurations. First match wins. |
  | `endpoints[].match.prefix` | Match requests whose path starts with this prefix |
  | `endpoints[].match.exact` | Match requests with exactly this path |
  | `endpoints[].match.headers` | Array of header match conditions (all must match) |
  | `endpoints[].responses` | Array of status-code distributions (weighted by resolution) |
  | `endpoints[].responses[].status` | HTTP status code (100-599) |
  | `endpoints[].responses[].resolution` | Weight for status selection AND number of pre-computed samples |
  | `endpoints[].responses[].distribution` | Percentile-to-duration mapping |
  | `endpoints[].load_based` | Load-sensitive behavior configuration |
  | `endpoints[].load_based.healthy` | Behavior below the healthy RPS threshold |
  | `endpoints[].load_based.tipping_point` | Behavior above the tipping point RPS |
  | `endpoints[].load_based.grey_zone` | Transition parameters between healthy and tipping |
  | `diagnostic` | Include the diagnostic `x-fault-worker-index` response header; defaults to `false` |

  ### Percentile Keys

  Percentile keys use the format `p<value>` where value is between 0 and 100:

  | Key | Quantile |
  |-----|----------|
  | `p0.0` | 0th percentile (minimum) |
  | `p25.0` | 25th percentile |
  | `p50.0` | 50th percentile (median) |
  | `p75.0` | 75th percentile |
  | `p90.0` | 90th percentile |
  | `p95.0` | 95th percentile |
  | `p99.0` | 99th percentile |
  | `p99.9` | 99.9th percentile |
  | `p99.99` | 99.99th percentile |
  | `p100.0` | 100th percentile (maximum) |

  Distribution values must be non-decreasing (a higher percentile cannot have a shorter duration).

  ### Grey Zone Configuration

  | Field | Description |
  |-------|-------------|
  | `penalty_base` | Base latency penalty at full grey zone position (e.g., "50ms") |
  | `spike_threshold` | Grey zone position (0-1) above which spike behavior activates |
  | `spike_penalty_duration` | How long a spike penalty persists (e.g., "2s") |
  | `spike_penalty_multiplier` | Multiplier applied to base penalty during spikes |
  | `recovery_rate` | Rate at which spike penalty decays (0-1) |

  ## How It Works

  ### Status Code Selection

  Each endpoint has one or more response entries with a `resolution` that serves as both:
  1. **Weight**: The probability of selecting that status code (proportional to total resolution)
  2. **Accuracy**: The number of pre-computed latency samples for that status code's distribution

  For example, with `resolution: 900` for status 200 and `resolution: 100` for status 503:
  - 90% of requests will get a 200 response with latency from the 200 distribution
  - 10% of requests will get a 503 abort with latency from the 503 distribution

  This status code rewriting assumes that the upstream responses are always "good" (e.g. 200) responses and will overwrite them with one of the  bad responses (e.g. 503).

  ### Latency Distribution

  The stateful probability distribution is inspired by [distribution-calculator](https://github.com/spockz/distribution-calculator). Given a set of percentiles, it:

  1. Pre-computes exactly `resolution` samples by interpolating between percentile boundaries
  2. Shuffles and serves them in random order
  3. Over a full cycle of `resolution` requests, the actual percentile distribution exactly matches the configured one

  ### Load-Based Behavior

  When `load_based` is configured, the process-global active-request count is passed as the current load value:
  - Below `healthy.threshold_rps`: Uses the healthy response distribution
  - Above `tipping_point.threshold_rps`: Uses the tipping point distribution
  - Between the two (**grey zone**): Probabilistically mixes between healthy and tipping based on position, with optional penalty

  ### Grey Zone Transitions

  In the grey zone, the filter:
  1. Calculates position as `(currentRPS - healthyRPS) / (tippingRPS - healthyRPS)` (0.0 to 1.0)
  2. Selects healthy or tipping distribution proportionally to position
  3. Adds a base latency penalty scaled by position
  4. If position exceeds `spike_threshold`, applies the spike multiplier for `spike_penalty_duration`
  5. Decays the spike penalty at `recovery_rate` when position drops below threshold

  ## Response Headers

  The filter adds response headers to indicate what was injected:

  | Header | Description |
  |--------|-------------|
  | `x-fault-injected-delay` | Target duration from the distribution (e.g., "52.3ms") |
  | `x-fault-actual-upstream` | Actual time the upstream took to respond |
  | `x-fault-added-delay` | Additional delay injected (target - upstream), or `0s` when none was added |
  | `x-fault-requests-in-flight` | Process-global in-flight matched request count observed at request entry, before the request is added |
  | `x-fault-worker-index` | Envoy worker index that made the fault decision; only included when `diagnostic` is `true` |
  | `x-fault-injected` | Set to "abort" when a non-2xx status was injected |
  | `x-fault-status` | The status code selected by the distribution |

  ## Performance considerations

  The `stateful` and `stateless` probability distributions have different CPU,
  memory, and concurrency characteristics. The benchmark sources in
  `performance_bench_test.go`, `endpoint_bench_test.go`,
  `internal/fault/performance_bench_test.go`, and `performance/` reproduce the
  measurements below.

  Use `stateful` when CPU efficiency and exact finite-cycle duration behavior are
  important; it remains the default. Use `stateless` for high-concurrency,
  throughput-sensitive configurations where lower contention, tail latency, and
  resolution-independent memory matter more, accepting higher CPU use. Load-based
  configurations show little difference because their outer mutex dominates both
  modes.

  ### Reproducing the analysis

  Run the benchmarks from the repository root with Go 1.26.6:

  ```sh
  export GOTOOLCHAIN=go1.26.6
  export GOCACHE=/tmp/boe-gocache
  export GOLANGCI_LINT_CACHE=/tmp/boe-golangci

  go test -C extensions/composer ./dynamic-fault-injection/internal/fault \
    -run '^$' \
    -bench='BenchmarkDurationSample|BenchmarkResponseSampleParallel|BenchmarkLoadBasedSampleParallel' \
    -benchmem -benchtime=300ms -count=3 -cpu=1,4,16

  go test -C extensions/composer ./dynamic-fault-injection/internal/fault \
    -run '^$' -bench='BenchmarkDurationSampleCycle' \
    -benchmem -benchtime=100ms -count=1 -cpu=1

  go test -C extensions/composer ./dynamic-fault-injection \
    -run '^$' -bench='BenchmarkFactoryConstruction' \
    -benchmem -benchtime=1x -count=3 -cpu=1

  go test -C extensions/composer ./dynamic-fault-injection \
    -run '^$' \
    -bench='BenchmarkDirectSampling|BenchmarkEndpointMatchedSampling|BenchmarkActiveRequestTracking|BenchmarkResponseHeaderWrites' \
    -benchmem -benchtime=500ms -count=3 -cpu=1,4,16
  ```

  Build the test-only runner to compare saturated CPU throughput and retained
  distribution memory. The `memory` form takes a mode, endpoint count, and
  resolution through environment variables. Run each mode separately so the
  shell's `time` output can be recorded:

  ```sh
  go test -C extensions/composer -c -o /tmp/dfi-performance.test \
    ./dynamic-fault-injection/performance

  DFI_PERFORMANCE_MODE=stateful time /tmp/dfi-performance.test -test.run '^$'
  DFI_PERFORMANCE_MODE=stateless time /tmp/dfi-performance.test -test.run '^$'

  DFI_PERFORMANCE_MODE=memory DFI_PERFORMANCE_DISTRIBUTION=stateful \
    DFI_PERFORMANCE_ENDPOINTS=1 DFI_PERFORMANCE_RESOLUTION=1000000 \
    /tmp/dfi-performance.test -test.run '^$'
  DFI_PERFORMANCE_MODE=memory DFI_PERFORMANCE_DISTRIBUTION=stateful \
    DFI_PERFORMANCE_ENDPOINTS=20 DFI_PERFORMANCE_RESOLUTION=1000000 \
    /tmp/dfi-performance.test -test.run '^$'
  DFI_PERFORMANCE_MODE=memory DFI_PERFORMANCE_DISTRIBUTION=stateless \
    DFI_PERFORMANCE_ENDPOINTS=1 DFI_PERFORMANCE_RESOLUTION=1000000 \
    /tmp/dfi-performance.test -test.run '^$'
  DFI_PERFORMANCE_MODE=memory DFI_PERFORMANCE_DISTRIBUTION=stateless \
    DFI_PERFORMANCE_ENDPOINTS=20 DFI_PERFORMANCE_RESOLUTION=1000000 \
    /tmp/dfi-performance.test -test.run '^$'
  ```

  The construction matrix covers resolutions from 10 through 1,000,000 and 1,
  5, 10, and 20 endpoint entries. Sampling benchmarks use fixed-response and
  load-based configurations, including grey-zone penalties. Their distributions
  are built once before the timed parallel loops, matching the filter factory
  lifecycle; the endpoint benchmark uses `/` for one endpoint and twenty specific
  prefixes for the route-scan case. The stateful cycle benchmark includes the
  reshuffle after a complete 100,000- or 1,000,000-sample cycle.

  To update the results below, record the median or representative values from
  the repeated benchmark output, copy the stateful/stateless `time` output and
  runner throughput, and record the retained heap values from the four `memory`
  invocations. Keep the machine, architecture, Go version, benchmark flags, and
  any changed configuration with the updated results so future runs remain
  comparable. Validate the benchmark files from this extension directory with:

  ```sh
  cd extensions/composer/dynamic-fault-injection
  GOTOOLCHAIN=go1.26.6 GOCACHE=/tmp/boe-gocache \
    GOLANGCI_LINT_CACHE=/tmp/boe-golangci \
    make -C ../.. EXTENSION_PATH=composer/dynamic-fault-injection format-go lint-go
  ```

  ### Results

  The measurements were run on Linux/amd64 on an AMD Ryzen 9 5900X with Go 1.26.6.

  For a two-status fixed response distribution at resolution 1,000 with five
  percentile boundaries, fixed response sampling was:

  | GOMAXPROCS | Stateful | Stateless |
  |---:|---:|---:|
  | 1 | about 250 ns/op, 95 B, 5 allocs | about 270 ns/op, 104 B, 7 allocs |
  | 16 | about 210 ns/op, 95 B, 5 allocs | about 65 ns/op, 104 B, 7 allocs |

  Duration-only sampling at 16-way parallelism was about 124 ns/op for stateful
  and 28 ns/op for stateless. At one worker, stateful was about 116 ns/op and
  stateless was about 124 ns/op for five percentile boundaries. Stateful timing
  includes periodic reshuffle costs amortized over each resolution cycle. The
  full-cycle benchmark reached 100,000 and 1,000,000 resolutions: one million
  samples took about 114 ms stateful and 126 ms stateless, so a complete stateful
  cycle is only modestly faster once its crypto shuffle is included.

  Load-based sampling showed almost no mode difference because
  `LoadBasedResponseDistribution.mu` covers tier selection, grey-zone calculations,
  status selection, and duration sampling:

  | Branch, 16-way parallelism | Stateful | Stateless |
  |---|---:|---:|
  | Healthy | about 260 ns/op | about 268 ns/op |
  | Grey zone | about 372 ns/op | about 386 ns/op |
  | Grey zone with penalty | about 420 ns/op | about 425 ns/op |
  | Tipping point | about 253 ns/op | about 268 ns/op |

  The endpoint benchmark matched the last entry, so twenty entries also paid the
  linear route scan:

  | Workload, 16-way parallelism | Stateful | Stateless |
  |---|---:|---:|
  | One matched endpoint | about 212 ns/op | about 61 ns/op |
  | Twenty specific endpoints | about 246 ns/op | about 68 ns/op |

  The direct factory path was about 210 ns/op stateful versus 60 ns/op stateless
  at 16-way parallelism. This is consistent with the endpoint result: the mode
  difference comes from the shared distribution rather than route matching.

  Stateful construction grows with resolution and endpoint count. With one status
  entry per endpoint, resolution 1,000,000 took about 117 ms and allocated 56 MB
  for one endpoint; twenty endpoints took about 2.2 s and allocated 1.12 GB in
  total. The retained-memory runner, which uses two status entries per endpoint,
  measured 8.8 MB retained heap for one endpoint and 176 MB for twenty endpoints.
  Stateless retained about 6 KB in either case and its construction stayed roughly
  constant with resolution. These retained-heap values cover the response
  distribution objects and their sample tables; parsed configuration and endpoint
  matching objects are outside that runner.

  The active-request counter measured about 0.8 ns for a load-only operation and
  3.2 ns for load plus increment/decrement serially. Under parallel contention,
  the entry/exit sequence measured about 25 ns at four workers and 28 ns at
  sixteen workers. Diagnostic response-header writes added about 45 ns, 16 bytes,
  and one allocation to a five-header response in the fake HeaderMap benchmark.

  The process runner used 16 goroutines, a shared two-status response distribution,
  and resolution 1,000 for three seconds. Stateful produced about 4.81 million
  samples/s with 4.07 s user CPU and 0.18 s system CPU. Stateless produced about
  16.08 million samples/s with 37.21 s user CPU and 1.46 s system CPU. This is a
  sampler throughput and CPU comparison, not an Envoy request-latency measurement.
  The throughput gain therefore costs roughly nine times as much aggregate user
  CPU in this saturated runner.

  ### Interpretation

  `ResponseDistribution.Sample` uses crypto-random status selection in both modes.
  Stateless adds crypto-random duration selection and percentile interpolation.
  Stateful avoids that per-sample duration work, but every sample takes the shared
  duration mutex. At low concurrency, stateful is slightly faster and uses fewer
  allocations. At higher concurrency, accesses to a shared stateful sampler queue
  behind that mutex, while stateless sampling scales across workers. Increasing
  resolution changes how often reshuffling occurs, but does not remove the
  per-request mutex or resident table memory.

  The stateful distribution is not rebuilt per request. `Create` allocates a
  per-stream filter containing the existing factory, while distributions are built
  in `buildFilterFactory`. The endpoint benchmark constructs one factory outside
  the timed loop and samples its shared distributions from parallel workers.

  The active-request counter is not the primary performance risk. Diagnostic mode
  has a measurable but small response-header cost. Load-based behavior is a
  separate case because its outer mutex masks most of the stateful/stateless
  difference.

  `stateless` is the stronger choice for high-concurrency throughput and tail
  latency: it avoids a cross-worker serialization point and avoids
  resolution-proportional resident memory and startup work. It also consumes much
  more CPU in the saturated runner because every request performs crypto-random
  duration sampling and interpolation. `stateful` remains the better choice when
  CPU efficiency and exact finite-cycle duration behavior are important. The
  measurements therefore do not justify changing the public default on performance
  alone; keep `stateful` as the default and document `stateless` for
  throughput-sensitive configurations. No production change is applied by this
  analysis.

  Full Envoy HTTP latency and tail-latency measurements were intentionally omitted
  after the scope was narrowed to Go-level CPU, memory, allocation, startup, and
  contention measurements. The sampler results identify a credible tail-latency
  risk from stateful queueing at high concurrency, but do not quantify HTTP p99.
