examples:
  - title: Delay all success responses and introduce a 1% failure rate that returns quickly
    description: |
      Wrap a succesfully and fast responding mock or stub service and make it a one matching the production performance and error ratio.
    code: |
      CONFIG=$(cat <<-END
      {
        "endpoints": [
          {
            "match": {
              "prefix": "/"
            },
            "responses": [
              {
                "status": 200,
                "resolution": 1000,
                "distribution": {
                  "p0.0": "30ms",
                  "p100.0": "500ms"
                }
              },
              {
                "status": 503,
                "resolution": 10,
                "distribution": {
                  "p0.0": "3ms",
                  "p100.0": "5ms"
                }
              }
            ]
          }
        ]
      }
      END
      )
      boe run \
          --extension dynamic-fault-injection \
          --log-level dynamic_modules:debug \
          --config "${CONFIG}"

      ❯ curl -v http://localhost:10000/status/200
      > GET /status/200 HTTP/1.1
