openapi: "3.0.0"
info:
  title: Test API
  version: "1.0"
paths:
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The item ID
        schema:
          type: integer
          format: int64
    get:
      operationId: getItem
      description: Get an item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
    delete:
      operationId: deleteItem
      description: Delete an item
      responses:
        "204":
          description: Deleted
  /items:
    post:
      operationId: createItem
      description: Create an item
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  readOnly: true
                name:
                  type: string
                  example: "Widget"
                tag:
                  type: string
                  nullable: true
              required:
                - id
                - name
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
  /search:
    get:
      summary: Search items
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
      responses:
        "200":
          description: OK
