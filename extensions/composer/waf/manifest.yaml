name: coraza-waf
parent: composer
categories:
  - Security
author: Tetrate
featured: true
description: Web Application Firewall (WAF) for HTTP traffic using Coraza
longDescription: |
  A Web Application Firewall (WAF) HTTP filter plugin that provides layer 7 security
  for web applications using the [Coraza WAF engine](https://coraza.io/).

  ## Features

  This plugin provides comprehensive web application security:

  - **[OWASP CRS (Core Rule Set)](https://coreruleset.org/)**: Built-in protection against common web attacks
  - **Request inspection**: Analyzes HTTP requests for malicious patterns and anomalies
  - **Response inspection**: Examines HTTP responses to prevent data leakage
  - **Flexible rule engine**: Supports custom security rules and policies
  - **Multiple operation modes**: Detection-only or active blocking modes
  - **Detailed logging**: Comprehensive audit logging of security events

  ## Security Rules

  The WAF comes with support for OWASP CRS, formerly known as ModSecurity Core Rule Set (CRS), as well as
  some recommended configurations and allows custom rule configuration for specific security requirements.
  It is recommended to **review the provided configuration files** before deploying, to ensure they align with
  the target environment and the expected security posture.
  To use the bundled rules, you can include them with the Coraza `Include` directives as shown in this example:

  ```json
  {
    "directives": [
      "Include @coraza.conf",
      "Include @crs-setup.conf",
      "Include @owasp_crs/*.conf"
    ]
  }
  ```

  Available special names are:

  | Name | Aliases | Description |
  |---|---|---|
  | `@coraza.conf-recommended` | — | Coraza upstream configuration file example |
  | [`@coraza.conf`](https://github.com/tetratelabs/built-on-envoy/blob/main/extensions/composer/waf/coraza/directives/%40coraza.conf) | `@recommended.conf`, `@recommended-conf` | Coraza configuration file tailored for Coraza dynamic module implementation |
  | `@crs-setup.conf.example` | — | CRS upstream configuration file example |
  | `@crs-setup.conf.example-nodefaultact` | — | CRS upstream configuration file example without the `SecDefaultAction` directives |
  | [`@crs-setup.conf`](https://github.com/tetratelabs/built-on-envoy/blob/main/extensions/composer/waf/coraza/directives/%40crs-setup.conf) | `@crs-setup-conf` | CRS configuration file tailored for Coraza dynamic module implementation |
  | `@owasp_crs/` | — | CRS rules directory |

  Note: Aliases are provided for backward compatibility, but are deprecated and may be removed in future releases. It is recommended to use the primary names for new configurations.

  To create custom rules, refer to the [SecLang reference docs](https://coraza.io/docs/seclang/).

  ## Mode

  The optional `mode` setting controls which parts of the HTTP exchange are evaluated by the WAF.
  Use the narrowest mode that matches your policy to avoid unnecessary processing.

  - `REQUEST_ONLY` (default): Inspect request headers, body, and trailers only. Best for deployments
    that focus on inbound only attack detection.
  - `FULL`: Inspect both request and response phases. Best for a fully deployed WAF with OWASP CRS
    usage.
  - `RESPONSE_ONLY` (deprecated): Inspect the response phase only, skipping request-phase rule
    evaluation. Retained for backward compatibility and will be removed in a future release.
    Note: response only mode is not compatibile with a default OWASP CRS installation because it
    skips request-phase initialization.

  ```json
  {
    "mode": "FULL",
    "directives": [
      "Include @coraza.conf",
      "Include @crs-setup.conf",
      "Include @owasp_crs/*.conf"
    ]
  }
  ```

  Note: `mode` only decides which request and response phases are passed to Coraza. It does not enable body access
  by itself. For example, `FULL` allows response-phase evaluation, but response body inspection still requires
  directives such as `SecResponseBodyAccess On`.

  ## Request URI

  The optional `request_uri_path_only` setting controls the value of `REQUEST_URI` (and `REQUEST_LINE`).

  - `false` (default): the absolute URL, e.g. `https://example.com/api?x=1`.
  - `true`: the path and query, e.g. `/api?x=1`, as in other Coraza and ModSecurity integrations. Path-based
    rules such as `SecRule REQUEST_URI "@beginsWith /api/"` require it.

  Note: the default will change to `true` in a future release. We recommend enabling it now and updating
  any rules that match the scheme or host in `REQUEST_URI` (use `REQUEST_HEADERS:Host` for the host).

  ## Metadata

  The plugin emits the following filter dynamic metadata when requests are blocked by the WAF:

  | Namespace | Key | Description |
  |-----------|-----|-------------|
  | `io.builtonenvoy.waf` | `block_phase` | Phase in which the requests has been blocked. See the [execution flow](https://coraza.io/docs/seclang/execution-flow/) for details on the possible values. |
  | `io.builtonenvoy.waf` | `block_rule` | ID of the rule that triggered the block. |

  ## Metrics

  The extension exposes the following metrics:

  | Metric | Tags | Type | Description |
  |--------|------|------|-------------|
  | `waf_tx_total` | - | Counter | Total amount of transactions processed by the WAF. |
  | `waf_tx_blocked` | `authority`, `phase`, `rule_id` | Counter | Total amount of transactions blocked by the WAF. The `rule_id` will not be set if the request is not blocked by a concrete rule but by a WAF internal error. |
  | `waf_tx_duration` | - | Histogram | Duration of WAF processing the transaction, in microseconds. |

  ### Histogram resolution

  Envoy records dynamic-module histograms without a unit, so its default bucket
  bounds apply verbatim to the microsecond values of `waf_tx_duration`. Two
  consequences:

  - Typical CRS evaluation lands in the ~0.5–10 ms range, which the default
    bounds cover with only five buckets (`500, 1000, 2500, 5000, 10000`).
  - The largest finite bound is 3,600,000 µs (3.6 s). `_sum`/`_count` and the
    admin-interface quantiles stay correct above it, but PromQL's
    `histogram_quantile()` clamps any quantile falling past the last finite
    bound to that bound.

  Both can be tuned in the Envoy bootstrap configuration, without touching the
  extension. Two details about the matcher, both of which fail silently when
  missed: it sees the stat name before tag extraction, i.e. with the
  `dynamicmodulescustom.` prefix, and `safe_regex` is matched against the whole
  name — hence the leading `.*` below.

  ```yaml
  stats_config:
    histogram_bucket_settings:
      - match:
          safe_regex:
            regex: ".*waf_tx_duration"
        # Sharper resolution across typical CRS latencies; ceiling at 10 s.
        buckets: [100, 250, 500, 750, 1000, 1500, 2500, 5000, 10000, 25000, 100000, 1000000, 10000000]
  ```

  ## Per Route Configuration

  The extension supports per-route configuration, allowing you to specify different WAF rules and policies for different routes in your application. This is useful for tailoring security measures to specific endpoints or services.

  The per-route configuration share the same format as the extension configuration and see Envoy's [Dynamic Per Route Configuration](https://www.envoyproxy.io/docs/envoy/latest/api-v3/extensions/filters/http/dynamic_modules/v3/dynamic_modules.proto) for more details on how to set it up.
