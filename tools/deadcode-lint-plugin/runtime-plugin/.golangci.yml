# This smoke check discovers the example through the same profile used for all Composer filters.
version: "2"
linters:
  default: none
  enable:
    - ffideadcode
  settings:
    custom:
      ffideadcode:
        type: goplugin
        path: ../out/ffideadcode.so
        description: Reports functions unreachable from imported SDK FFI entrypoints.
        settings:
          composer:
            directory: ../../extensions/composer
            include: [example]
