name: Retest Action on PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  retest:
    if: |
      github.event.issue.pull_request
      && github.repository == 'tetratelabs/built-on-envoy'
      && github.event.issue.state == 'open'
      && github.actor != 'dependabot[bot]'
    name: Retest
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: write
    steps:
      - uses: envoyproxy/toolshed/gh-actions/retest@actions-v0.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}          
